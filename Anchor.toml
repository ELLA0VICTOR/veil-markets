[toolchain]
anchor_version = "0.32.0"
solana_version = "2.3.0"

[features]
seeds = true
skip-lint = false

[programs.devnet]
veil_markets = "VEiLmArKEtS111111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[workspace]
members = ["programs/*"]
